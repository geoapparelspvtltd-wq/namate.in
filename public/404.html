<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>N A M A T E</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    // Checks if the page was loaded at a non-root path & redirects 
    // with that path encoded into query parameters so index.html can route back to it.
    var l = window.location;
    // Determine pathSegmentsToKeep automatically (e.g. if we are on a GitHub repository subdirectory repo/):
    var isGitHubPages = l.hostname.indexOf('github.io') !== -1;
    var pathSegmentsToKeep = 0;
    if (isGitHubPages) {
      var pathParts = l.pathname.split('/');
      if (pathParts[1] && pathParts[1] !== 'index.html') {
        pathSegmentsToKeep = 1; // Keep the repository subfolder segment
      }
    }
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
